<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Dado">
  <!--
    Ícone da aba: a face 5 de um dado, que é o que o jogo tem de mais
    reconhecível. Cinco pontos porque ainda se distinguem a 16 px — uma face
    cheia viraria uma mancha.
  -->
  <style>
    /* A barra de abas também tem tema. No escuro o azul clareia e os pontos
       escurecem, para o ícone não afundar no fundo nem perder os pontos. */
    .die { fill: #1d4ed8; }
    .pip { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .die { fill: #6f9dff; }
      .pip { fill: #101420; }
    }
  </style>
  <rect class="die" x="2" y="2" width="28" height="28" rx="7"/>
  <g class="pip">
    <circle cx="10" cy="10" r="3.1"/>
    <circle cx="22" cy="10" r="3.1"/>
    <circle cx="16" cy="16" r="3.1"/>
    <circle cx="10" cy="22" r="3.1"/>
    <circle cx="22" cy="22" r="3.1"/>
  </g>
</svg>
